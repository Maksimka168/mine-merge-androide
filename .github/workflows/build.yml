name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip python3-pip python3-dev python3-venv \
            libffi-dev libssl-dev libxml2-dev libxslt1-dev \
            libjpeg8-dev zlib1g-dev libncurses5-dev libgdbm-dev \
            libnss3-dev libsqlite3-dev libreadline-dev libbz2-dev \
            pkg-config libopenblas-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libfreetype6-dev \
            libportmidi-dev libjpeg-dev libtiff5-dev libwebp-dev

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          build-tools-version: 30.0.3

      - name: Install Buildozer and Cython
        run: pip install buildozer cython

      - name: Initialize Buildozer
        run: |
          buildozer init
          sed -i 's/title = .*/title = MineMerge/' buildozer.spec
          sed -i 's/package.name = .*/package.name = minemerge/' buildozer.spec
          sed -i 's/package.domain = .*/package.domain = com.yourname.minemerge/' buildozer.spec
          sed -i 's/requirements =.*/requirements = python3, pygame==2.6.0, android/' buildozer.spec
          sed -i 's/orientation =.*/orientation = landscape/' buildozer.spec
          sed -i 's/fullscreen = .*/fullscreen = 0/' buildozer.spec
          sed -i 's/android.api =.*/android.api = 30/' buildozer.spec
          sed -i 's/android.minapi =.*/android.minapi = 21/' buildozer.spec

      - name: Build APK
        run: buildozer android debug 2>&1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineMerge-APK
          path: bin/*.apk
